<style>
:root{--bg:#0f1117;--panel:#181b24;--panel2:#212532;--text:#e9ecf2;--muted:#9aa3b2;--accent:#ffcc00;--hot:#ff4f6d;--ok:#3ddc84;--blue:#4fa3ff;--line:#2a2f3c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,Roboto,sans-serif}
a{color:inherit}
button,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.costly{background:#fff;color:#111;border-color:#fff}
button.costly:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
button:disabled{opacity:.55;cursor:default}
button.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,23,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
/* logo ULTRA SAMI: dvě vrstvy stejného rozměru – nápis a bílé rohové čáry, které se při najetí myší oddálí */
.logo{position:relative;height:52px;aspect-ratio:434/120;flex:none;cursor:default}
.logo img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none}
.logo .br{transition:transform .35s cubic-bezier(.2,.8,.2,1.4)}
.logo:hover .br{transform:scale(1.13,1.3)}
.logo .lg{transition:transform .35s ease, filter .35s ease}
.logo:hover .lg{transform:scale(1.04);filter:drop-shadow(0 0 6px rgba(255,80,110,.55))}
@media (max-width:600px){.logo{height:38px}}
#status{color:var(--muted);flex:1;min-width:160px}
#status.err{color:var(--hot)}
.right{display:flex;gap:8px;align-items:center}
#quota{color:var(--muted);font-size:12px}
#quota{display:inline-flex;flex-wrap:wrap;gap:2px 10px;justify-content:flex-end}
#quota b{color:var(--text);font-weight:600}
#quota .hot{color:var(--hot)}
/* hlavní lišta (co chci vidět) je velká a výrazná; státy pod ní jsou menší „kategorie“ v rámečku */
/* hlavní části stránky = záložky jako na webu (podtržené, velké); pod nimi „kategorie“ = malé čipy v rámečku */
nav{display:flex;gap:2px;margin-top:12px;flex-wrap:wrap;align-items:flex-end;border-bottom:2px solid var(--line)}
nav button{border:0;border-bottom:4px solid transparent;border-radius:10px 10px 0 0;margin-bottom:-2px;padding:10px 16px 8px;font-weight:800;font-size:16px;background:transparent;color:var(--muted)}
nav button:hover{color:var(--text);background:var(--panel)}
nav button.on{background:var(--panel2);color:var(--accent);border-bottom-color:var(--accent)}
nav button.costly{background:transparent;color:var(--muted);border-color:transparent;box-shadow:none}
.cats{display:flex;gap:5px;margin-top:8px;overflow-x:auto;padding:5px 8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.cats::before{color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap;margin-right:4px}
#periods::before{content:"📅 Období:"}
#countries::before{content:"🌍 Stát:"}
.cats button{white-space:nowrap;border-radius:999px;padding:4px 10px;font-size:12.5px}
.cats button.on{background:transparent;border-color:var(--accent);color:var(--accent);font-weight:700}
/* 🗄️ Archiv v řadě období: oddělený a jemně jiný (čárkovaný, tlumený) – není to časové období, ale uložená data */
.cats button.archbtn{margin-left:6px;border-style:dashed;border-radius:8px;color:var(--muted);position:relative}
.cats button.archbtn::before{content:"";position:absolute;left:-7px;top:15%;bottom:15%;border-left:1px solid var(--line)}
.cats button.archbtn.on{color:var(--accent);border-style:solid}
/* 🔑 kvóta: jeden součet za všechna zařízení + bar, kolik z maxima je pryč */
#quota .qp{display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
#quota .qi{display:inline-flex;gap:4px;align-items:center}
.qm{display:inline-block;width:54px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.qm i{display:block;height:100%;background:var(--ok);border-radius:3px}
#quota .hot .qm i{background:var(--hot)}
/* světle zelený odhad, kolik hledání padne do konce dne (pod skutečným stavem) */
.qm{position:relative}
.qm i.qpj{position:absolute;left:0;top:0;background:#3ddc8455}
.qm i.qpj.over{background:#ff4f6d55}
.qm i:not(.qpj){position:relative}
.calalts{display:flex;flex-direction:column;gap:4px;margin:2px 0 8px}
.calaltrow{display:flex;gap:8px;align-items:center;background:var(--panel2);border-radius:8px;padding:5px 8px}
.calaltrow span{flex:1;min-width:0}
.calaltrow b{color:var(--accent)}
.calcopy{padding:2px 7px;font-size:13px}
.calalt{margin:4px 0}
/* ⭐ šablona názvu, kterou se vyplatí použít */
.fmt.tplhot{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel));box-shadow:0 0 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.fmt.tplhot > summary b{font-size:17px;color:var(--accent)}
.tag.tplstar{background:var(--accent);color:#111;font-weight:900;border-color:var(--accent)}
.pingask{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0;padding:8px 10px;border:1px solid var(--accent);border-radius:10px;background:var(--panel2)}
.calping{margin:4px 0}
/* 🎬 Výroba */
.vyrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin:12px 0}
.vyrcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.vyrcard.live{border-color:var(--hot);box-shadow:0 0 16px color-mix(in srgb,var(--hot) 25%,transparent)}
.vyrcard.empty{opacity:.75}
.vyrcard .row{display:flex;flex-wrap:wrap;gap:4px 14px}
.vyrhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vyrhead h3{margin:0}
.vyrname{margin-left:auto;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vyrbig{display:flex;gap:10px;align-items:center;margin:10px 0 4px}
.vyrbig b{font-size:22px;min-width:3.2em;text-align:right}
.vyrbar{position:relative;flex:1;display:inline-block;height:10px;border-radius:5px;background:var(--line);overflow:hidden;min-width:60px}
.vyrbig .vyrbar{height:16px;border-radius:8px}
.vyrbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:inherit;transition:width .6s}
.vyrbar.bad i{background:var(--hot)}
.vyrbar u{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.14);border-radius:inherit}
.vyrbar.step i{background:var(--blue);opacity:.9}
.vyrrows{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.vyrrow{display:grid;grid-template-columns:2.6em minmax(0,9em) 1fr auto auto;gap:8px;align-items:center;font-size:13px}
.vyrrow.step{grid-template-columns:3em minmax(0,1.4fr) 1fr 104px}
.vyrrow.step > .ch:last-child{text-align:right;white-space:nowrap}
.vyrrow .vyrlbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vyrrow.done,.vyrrow.hotovo,.vyrrow.preskoceno{opacity:.6}
.vyrrow.bezi{font-weight:700}
.vyrrow.bezi .vyrbar.step i{background:var(--accent)}
.vyrrow.hotovo .vyrbar.step i{background:var(--ok)}
.vyrrow.preskoceno .vyrbar.step i{background:var(--muted)}
.vyrrow.pozde .vyrbar.step i{background:#f4a261}
.vyrrow.pozde .ch{color:#f4a261}
.vyrbar.neurc i{background:repeating-linear-gradient(90deg,var(--accent) 0 12px,transparent 12px 24px);animation:neurc 1s linear infinite;width:100%!important}
@keyframes neurc{to{background-position:24px 0}}
.vyrdone{margin-top:8px}
.vyrdone .vyrrows{margin-top:6px}
.vyrlog.vyrdone > div{max-height:none;overflow:visible;font:inherit;background:none;padding:0;white-space:normal}
.vyrrow.err b{color:var(--hot)}
.vyrpct{min-width:3em;text-align:right;font-weight:700}
.vyraxis{display:flex;justify-content:space-between;margin-top:-2px}
.vyrlog{margin-top:10px}
.vyrlog > div{max-height:260px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--panel2);border-radius:8px;padding:6px 8px;white-space:pre-wrap;word-break:break-word}
.vyrcard.wide{grid-column:1/-1}
/* ⏱️ živý ukazatel nahoře */
.vyrlive2{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;margin:10px 0;padding:14px 18px;border-radius:14px;background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--line)}
.vyrlive2 > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.vyrlive2 b{font-size:26px;line-height:1.1}
.vyrlive2 .cur b{color:var(--accent);font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80vw}
.vyrlive2 .cur .ch b,.vyrlive2 > .ch b{font-size:13px;color:var(--text)}
.vyrlive2 .vyrday{flex:1 1 260px;gap:5px;max-width:520px;margin-left:auto}
.vdr{display:grid;grid-template-columns:10px minmax(0,150px) 1fr auto;gap:8px;align-items:center;font-size:13px;padding:2px 6px;margin:0 -6px;border-radius:7px;transition:background .3s}
.vdr i{width:10px;height:10px;border-radius:3px}
.vdr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.vdr u{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;text-decoration:none}
.vdr s{display:block;height:100%;border-radius:4px;animation:vdgrow .9s cubic-bezier(.2,.8,.2,1) both}
.vdr em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.vdr.cur{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.vdr.cur span{color:var(--text);font-weight:700}
.vdr.new{animation:vdin .5s ease-out both}
@keyframes vdgrow{from{width:var(--from)}}
@keyframes vdin{from{opacity:0;transform:translateX(-8px)}}
.vyrlive2 .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--hot);margin-right:4px;animation:vyrpulse 1.4s infinite}
.vyrcard{position:relative}
.vyrclose{position:absolute;top:8px;right:8px;width:30px;height:30px;padding:0;border-radius:50%;z-index:2}
.vyrcard.vyrmini{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;opacity:.85}
.vyrcard.vyrmini button{margin-left:auto;font-size:12px;padding:3px 10px}
.vyrhead{padding-right:36px}
.stgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.stgrid h4{margin:6px 0}
.stnums{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.stnums b{font-size:18px;color:var(--accent)}
.stlist{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0;font-size:13px}
.stlist i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.stchart{display:flex;gap:3px;align-items:flex-end;height:150px;margin-top:8px;padding-bottom:2px}
.stcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;height:100%;font-size:10px;color:var(--muted)}
.stcol span{order:-1;height:14px}
.stbar{flex:1;width:100%;display:flex;flex-direction:column-reverse;justify-content:flex-start;border-radius:4px 4px 0 0;overflow:hidden;background:var(--panel2)}
.stbar i{display:block;width:100%;transition:filter .2s}
.stcol b{font-weight:600}
.stcol[data-st]{cursor:pointer;transition:opacity .25s}
.stcol .stbar{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;transform-origin:bottom}
.stchart:hover .stcol:not(.on),.stchart:has(.stcol.on) .stcol:not(.on){opacity:.45}
.stcol.on .stbar{transform:scaleX(1.12) translateY(-3px);box-shadow:0 0 0 2px var(--accent),0 6px 16px rgba(0,0,0,.35)}
.stcol.on span,.stcol.on b{color:var(--text);font-weight:800}
.stbar i.on{filter:brightness(1.35) saturate(1.2)}
.stchart.anim .stbar{animation:stgrow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k) * 28ms)}
@keyframes stgrow{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
#sttip{position:fixed;left:0;top:0;z-index:999;min-width:230px;max-width:min(340px,calc(100vw - 16px));padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.45);font-size:13px;pointer-events:none;opacity:0;transition:opacity .18s,transform .14s cubic-bezier(.2,.8,.2,1)}
#sttip.show{opacity:1}
#sttip .tth{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--line)}
#sttip .tth b{font-size:17px;color:var(--accent)}
#sttip .ttr{display:grid;grid-template-columns:10px 1fr auto;gap:2px 8px;align-items:center;padding:4px 6px;margin:0 -6px;border-radius:8px;animation:ttin .25s ease-out both}
#sttip .ttr:nth-child(3){animation-delay:30ms}#sttip .ttr:nth-child(4){animation-delay:60ms}#sttip .ttr:nth-child(n+5){animation-delay:90ms}
#sttip .ttr.on{background:var(--panel2)}
#sttip .ttr i{width:10px;height:10px;border-radius:3px}
#sttip .ttr span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sttip .ttr u{grid-column:2/4;height:4px;border-radius:2px;background:var(--panel2);overflow:hidden;text-decoration:none}
#sttip .ttr u s{display:block;height:100%;border-radius:2px;animation:ttbar .5s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
#sttip .ttr em{grid-column:2/4;font-style:normal;font-size:11px;color:var(--muted)}
#sttip .ttsep{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 2px}
@keyframes ttin{from{opacity:0;transform:translateY(4px)}}
@keyframes ttbar{from{transform:scaleX(0)}}
@media (max-width:600px){.stcol{font-size:8px}.stchart{gap:2px}}
.vyrnahled{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 4px;padding:8px 10px;border-radius:10px;background:var(--panel2)}
.vyrnahled .btnlink{padding:7px 12px}
.vyrmini .vyrnahled{flex-basis:100%;margin:2px 0 0}
.btnlink{display:inline-block;text-decoration:none;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:700}
.btnlink.primary{background:var(--accent);color:#111;border-color:var(--accent)}
.vyrtl{margin-top:12px}
.vyrtl .row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.vyrtl .seg button{font-size:12px;padding:4px 9px}
.tlwrap{touch-action:pan-x;overflow-x:auto;overflow-y:hidden;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);-webkit-overflow-scrolling:touch}
.tlinner{position:relative;padding:0 0 6px}
.tlruler{position:relative;height:18px;margin-left:36px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}
.tlruler span{position:absolute;top:2px;padding-left:3px;border-left:1px solid var(--line);height:16px;white-space:nowrap}
.tlmk{position:relative;height:10px;margin-left:36px}
.tlmk b{position:absolute;top:1px;width:6px;height:8px;margin-left:-3px;border-radius:1px 1px 3px 3px}
.tlrow{display:flex;height:15px;margin-top:2px}
.tlrow.A:first-of-type,.tlrow.V + .tlrow.A{margin-top:8px}
.tllbl{position:sticky;left:0;z-index:2;flex:0 0 32px;margin-right:4px;font-size:10px;font-weight:700;color:var(--muted);background:var(--panel2);text-align:center;line-height:15px}
.tllane{position:relative;flex:1}
.tllane i{position:absolute;top:0;bottom:0;border-radius:2px;background:#4f7cff;box-shadow:inset -1px 0 0 rgba(0,0,0,.35);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-style:normal;font-size:10px;line-height:15px;padding:0 3px;box-sizing:border-box;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
.tlrow.P .tllane i{line-height:17px}
.tlrow.A .tllane i{background:#2ec4b6}
.tlrow.P{height:17px}
.tlrow.P .tllbl{font-size:13px;line-height:17px}
.vyrgbox{position:relative;cursor:crosshair}
.vyrgbox svg{display:block}
.vyrgline{position:absolute;top:0;bottom:0;width:1px;background:var(--muted);pointer-events:none}
.vyrgdot{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--accent);pointer-events:none}
.vyrgtip{position:absolute;top:-4px;padding:2px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-size:12px;white-space:nowrap;pointer-events:none}
.tllegend{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:6px}
.tlleg{font-size:12px;padding:3px 8px;border-radius:999px}
.tlleg.on{background:var(--accent);color:#111;border-color:var(--accent)}
.tllbl[data-vyrfocus]{cursor:pointer}
.tlrow.dim{opacity:.25}
.tlrow.hl .tllane i{box-shadow:0 0 0 2px #fff,0 0 8px var(--accent)}
.tlguide{position:absolute;top:28px;bottom:0;background:color-mix(in srgb,var(--accent) 22%,transparent);border-left:1px solid var(--accent);pointer-events:none;z-index:1}
.tlmoments{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.tlmoments button{font-size:11px;padding:2px 7px}
.tlmoments .unfocus{flex-basis:100%;background:var(--hot);border-color:var(--hot);color:#fff;font-size:16px;font-weight:900;padding:10px 14px}
.vyrpulse{animation:vyrpulse 1.4s ease-in-out infinite}
@keyframes vyrpulse{50%{opacity:.45}}
#tabs .vyrlive{box-shadow:inset 0 -3px 0 var(--hot)}
@media (max-width:600px){.vyrgrid{grid-template-columns:1fr}.vyrrow{grid-template-columns:2.4em minmax(0,6.5em) 1fr auto}.vyrrow > .ch:last-child{display:none}.vyrrow.step{grid-template-columns:2.4em minmax(0,1fr) 64px 78px}.vyrrow.step > .ch:last-child{display:block;font-size:11px;white-space:nowrap;text-align:right}}

.starnewsec{border:2px solid var(--hot);border-radius:14px;padding:10px 12px;margin:8px 0 14px}

.card.cardnew{box-shadow:0 0 0 2px var(--hot)}
.newbadge{position:absolute;right:8px;bottom:8px;background:var(--hot);color:#fff;font-weight:900;font-size:11px;border-radius:6px;padding:2px 7px}
.calttl{display:flex;gap:6px;align-items:center;padding-right:44px} /* místo pro ✖ zavřít vpravo nahoře */

.flag{width:20px;height:15px;object-fit:cover;border-radius:2px;vertical-align:-2px;margin-right:6px;box-shadow:0 0 0 1px rgba(255,255,255,.15)}

  try { localStorage.setItem('bt_oauth_st', st); sessionStorage.setItem('bt_period_s', S.period); if (CAL_LINK) localStorage.setItem('bt_callink', CAL_LINK); } catch {}

  if (email) p.login_hint = email;

  // Chrome na některých telefonech (třeba POCO) přesměrování spuštěné skriptem potichu zahodí → velký OPRAVDOVÝ odkaz,
  // na který se ťukne prstem (to Chrome pustí vždy); skript to pro jistotu zkusí i sám
  document.querySelector('.oauthgo')?.remove();
  const ov = document.createElement('div'); ov.className = 'histov oauthgo';
  ov.innerHTML = `<div class="histbox askbox"><h3>☁️ Přihlášení Googlem</h3>
    <div class="ch">${email ? `Účet: <b>${esc(email)}</b><br>` : ''}Když se přihlášení neotevřelo samo, ťukni na tlačítko:</div>
    <a class="oauthbtn" href="${esc(url)}">➡️ Přihlásit se Googlem</a>
    <div class="row"><button data-no>Zrušit</button></div></div>`;
  ov.addEventListener('click', e => { if (e.target.closest('[data-no]') || bgClick(e, ov)) ov.remove(); });
  document.body.append(ov);

}
// návrat z přihlášení: přístup z adresy uložit (jako po přihlášení oknem) a adresu uklidit
(() => {
  const h = new URLSearchParams(location.hash.slice(1));
  if (!h.get('access_token') && !h.get('error')) return;
  let st = null; try { st = localStorage.getItem('bt_oauth_st'); localStorage.removeItem('bt_oauth_st'); } catch {}
  history.replaceState(null, '', location.pathname + location.search);

  if (h.get('error')) { OAUTH_MSG = `☁️ Google přihlášení nevyšlo: ${h.get('error_description') || h.get('error')}${h.get('error') === 'access_denied' ? ' (přístup nepovolen – zkus znovu a povol přístup k Disku)' : ''}`; return; }

  try { localStorage.setItem('bt_gdrive', 'true'); } catch {}
})();
async function driveSignIn(pick) {
  if (!gClientId()) throw new Error('Chybí Client ID pro přihlášení Googlem (⚙️ Nastavení).');
  if (useRedirect()) { driveRedirect(pick ? '' : ls('bt_gemail', ''), pick); return new Promise(() => {}); } // stránka odchází
  await loadGis();
  await new Promise((res, rej) => {
    google.accounts.oauth2.initTokenClient({
      // na mobilu bez předvyplněného e-mailu: účet, který není v telefonu, Chrome zachytí a chce „synchronizaci“ (bílá obrazovka)
      client_id:gClientId(), scope:'https://www.googleapis.com/auth/drive', login_hint:pick || isTouch() ? undefined : ls('bt_gemail', '') || undefined,
      ...(pick ? {prompt:'select_account'} : {}),
      callback:r => {
        if (r.error) return rej(new Error(r.error_description || r.error));
        DRIVE.token = r.access_token; DRIVE.exp = Date.now() + r.expires_in * 1000;
        // přihlášení si pamatuje jen tahle karta (sessionStorage) – přežije obnovu stránky po aktualizaci
        try { sessionStorage.setItem('bt_tok', JSON.stringify({t:DRIVE.token, exp:DRIVE.exp})); } catch {}
        res();
      },
      error_callback:e => rej(new Error(e.type === 'popup_closed' ? 'Přihlášení zavřeno.' : 'Přihlašovací okno se neotevřelo (blokované vyskakovací okno?).')),
    }).requestAccessToken({prompt:pick ? 'select_account' : ''});
  });
}
async function gfetch(url, opts = {}) {
  if (!DRIVE.token || Date.now() > DRIVE.exp - 60e3) throw new Error('auth');
  const r = await fetch(url, {...opts, headers:{...(opts.headers || {}), Authorization:'Bearer ' + DRIVE.token}});
  if (r.status === 401) { DRIVE.token = null; throw new Error('auth'); }
  if (!r.ok) { let why = ''; try { why = (await r.json()).error?.errors?.[0]?.reason || ''; } catch {} throw new Error('Google Disk odpověděl chybou ' + r.status + (why ? ' ' + why : '')); }
  return r;
}
async function dList(q) {
  const out = []; let page;
  do {
    const r = await (await gfetch(`${DAPI}/files?` + new URLSearchParams({q, pageSize:1000, orderBy:'createdTime', fields:'nextPageToken,files(id,name,modifiedTime,ownedByMe,md5Checksum,owners(emailAddress))', ...(page ? {pageToken:page} : {})}))).json();
    out.push(...r.files); page = r.nextPageToken;
  } while (page);
  return out;
}
const dEsc = s => s.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
async function dFolder(name, parent) {
  const r = await gfetch(`${DAPI}/files?fields=id`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, mimeType:'application/vnd.google-apps.folder', ...(parent ? {parents:[parent]} : {})})});
  return (await r.json()).id;
}
async function dUpload(name, parent, blob, fileId) {
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(fileId ? {name} : {name, parents:[parent]})], {type:'application/json'}));
  form.append('file', blob);
  const r = await gfetch(`https://www.googleapis.com/upload/drive/v3/files${fileId ? '/' + fileId : ''}?uploadType=multipart&fields=id,modifiedTime`, {method:fileId ? 'PATCH' : 'POST', body:form});
  return r.json();
}
const dGet = id => gfetch(`${DAPI}/files/${id}?alt=media`);
const dDel = id => gfetch(`${DAPI}/files/${id}`, {method:'DELETE'}).catch(() => {}); // cizí soubor smazat nejde – nevadí

async function driveInit(create) {
  DRIVE.email = (await (await gfetch(`${DAPI}/about?fields=user(emailAddress)`)).json()).user.emailAddress;
  ss('bt_gemail', DRIVE.email);
  const mime = "mimeType='application/vnd.google-apps.folder' and trashed=false";
  const found = await dList(`name='${dEsc(DRIVE_FOLDER)}' and ${mime}`);
  // přednost má složka, kterou vlastní některý z majitelských účtů (kdyby si někdo omylem založil vlastní)
  // (hlavní je složka účtu OWNER_HASHES[0]; kdyby měl druhý majitelský účet omylem vlastní, ta se nepoužije)
  const rank = f => { const e = f.owners?.[0]?.emailAddress; return e && emailHash(e) === OWNER_HASHES[0] ? 2 : isOwnerEmail(e) ? 1 : 0; };

// Ten na běžném Disku nesmí zakládat soubory (nemá vlastní místo) – smí jen přepisovat nasdílené.
// Proto mu majitel jednou předpřipraví 16 prázdných souborů s_bt_h_0…f__github-action.json, které pak robot plní.
const ROBOT = 'github-action';
async function prepareRobotFiles() {
  const have = new Set((await dList(`'${DRIVE.folder}' in parents and name contains '__${ROBOT}' and trashed=false`)).map(f => f.name));
  // + s_bt_new__… pro 🔔 zvoneček (nová videa 📌 kanálů, která robot najde v RSS)
  for (const k of [...Array.from({length:16}, (_, i) => 'bt_h_' + i.toString(16)), 'bt_new']) {
    const name = `s_${k}__${ROBOT}.json`;
    if (!have.has(name)) await dUpload(name, DRIVE.folder, new Blob([JSON.stringify({k, v:{}, t:0})], {type:'application/json'}));
  }
  // 🔥 „horké“ soubory grafů: robot do nich každých 30 min zapisuje jen čerstvá videa (do 4 dnů) – malé, rychlé.
  // Velké soubory se všemi videi přepisuje jen jednou za 6 h (dřív každý běh → došel denní limit robota).
  for (let i = 0; i < 16; i++) {
    const k = 'bt_h_' + i.toString(16), name = `s_${k}__${ROBOT}-hot.json`;
    if (!have.has(name)) await dUpload(name, DRIVE.folder, new Blob([JSON.stringify({k, v:{}, t:0})], {type:'application/json'}));
  }
}

async function driveConnect(create, pick) {
  // 📱 bez platného přihlášení rovnou na přihlášení Googlu (i když předchozí pokus ještě „visí“)

// Robot na Googlu (Apps Script) každých 10 min kouká na RSS 📌 kanálů (zdarma, bez kvóty) a nová videa zapíše
// do bt_new = {id: {cid, pub}}. Stránka je doplní do Novinek / Týdne / Měsíce (1 dotaz na 50 videí) a robot jim hned sbírá body grafu.
const NEWDONE = new Set();
async function ingestNew() {
  if (!S.key) return 0; // bez klíče detaily videa stáhnout nejde – doplní je majitel
  const by = {}, have = {};
  // co už v seznamech státu máme – načíst jednou na stát (getSet rozbaluje celý velký seznam; stovky volání = zamrzlý prohlížeč)
  const known = cid => have[cid] ??= new Set(TIME_PERIODS.flatMap(p => (ls(ckey(cid, p), null)?.items || []).map(i => i.id)));
  for (const [id, e] of Object.entries(ls('bt_new', {}))) {
    if (NEWDONE.has(id) || !COUNTRIES.some(c => c.id === e.cid)) continue;
    NEWDONE.add(id);
    if (!(Date.now() - Date.parse(e.pub) < 30 * 864e5)) continue;
    if (known(e.cid).has(id)) continue; // už ho máme
    (by[e.cid] = by[e.cid] || []).push(id);
  }
  let n = 0;
  const nw = ls('bt_new', {});
  for (const [cid, ids] of Object.entries(by)) {
    // s:1 = robot to našel hledáním (jako dřív „nejnovější“ na stránce), jinak z kanálu (zvoneček)
    const now = Date.now(), items = (await details(ids)).map(it => ({...(nw[it.id]?.s ? classify(it) : classify(it, 'ch')), st:now}));
    learnChannels(C(cid), items.filter(it => nw[it.id]?.s && !it.cand)); // noví youtubeři se začnou sledovat
    for (const [p, h] of [['day', 24], ['week', 168], ['month', 720]]) {
      const fit = items.filter(it => now - new Date(it.pub) < h * 3600e3);
      if (fit.length && getSet(cid, p)) mergeInto(cid, p, fit);
    }
    archive(cid, items); n += items.length;
    logEvent(`🔔 zvoneček ${C(cid).name}: +${items.length} ${items.length === 1 ? 'nové video' : 'nových videí'}`);
  }
  return n;
}

// Stáhne videa jednoho kanálu za posledních 30 dní a přidá je do Novinek / Týdne / Měsíce (2 dotazy, žádné hledání)
async function pullChannel(c, chId) {
  const r = await api('playlistItems', {part:'contentDetails', playlistId:'UU' + chId.slice(2), maxResults:50}, 1);
  const ids = (r.items || []).map(i => i.contentDetails.videoId);
  const items = ids.length ? (await details(ids)).map(it => classify(it)) : [];
  const fresh = items.filter(it => Date.now() - new Date(it.pub) < 720 * 3600e3);
  for (const p of ['day', 'week', 'month']) {
    const since = Date.now() - PERIODS[p].hours * 3600e3, add = fresh.filter(it => new Date(it.pub) >= since);
    if (!add.length) continue;
    const set = getSet(c.id, p);
    if (set) mergeInto(c.id, p, add);
    else if (p !== 'day') putSet(c.id, p, {ts:Date.now(), searchTs:Date.now(), items:add, next:null}); // aspoň něco, plné hledání přijde samo
  }
  archive(c.id, fresh);
  const db = ls(chKey(c.id), {});
  if (db[chId]) { db[chId].pulled = Date.now(); for (const it of fresh) if (!db[chId].ids.includes(it.id)) db[chId].ids = [...db[chId].ids, it.id].slice(-40); ss(chKey(c.id), db); }

}

const CHPOLL = {};
async function fetchChannelVideos(c, p, have) {

    .map(x => x.contentDetails.videoId))];

  return (await details(ids)).map(it => ({...classify(it, 'ch'), st:now}));

const DISC_EVERY_OPTS = [1, 7, 20, 30]; // dní; výchozí 20 – zato důkladně (všechny výrazy najednou)
const discInfo = cid => ls('bt_disc', {})[cid] || {};
function saveDisc(cid, patch) {

  for (const k of ['crawled', 'checked']) if (e[k]) e[k] = Object.fromEntries(Object.entries(e[k]).sort((a, b) => b[1] - a[1]).slice(0, 1500));

const alive = it => (it.subs ?? 1000) >= 200 || it.views >= 1000;
async function discoverSearch(c, qi0) {
  const qs = DISC_Q[c.id] || ['brawl stars'], d = discInfo(c.id), qi = (qi0 ?? d.qi ?? 0) % qs.length, q = qs[qi];

    const known = trackedIds(c), checked = {...(discInfo(c.id).checked || {})};
    const ids = s.items.map(i => i.id.channelId || i.snippet.channelId).filter(id => id && !known.has(id) && !checked[id]);
    const n = await verifyCandidates(c, ids, checked);

  }
  const params = {part:'snippet', type:'video', order:'date', maxResults:50, q, relevanceLanguage:c.lang, regionCode:c.region,
    publishedAfter:isoNoMs(new Date(Date.now() - 7 * 24 * 3600e3))};
  const s = await api('search', params);

// doporučené kanály ze sledovaných → kandidáti → ověření podle jejich posledních videí (vše bez hledání, ~1 dotaz na kanál)
async function discoverFeatured(c, maxCrawl = 15, maxCheck = 30) {
  const d = discInfo(c.id), crawled = {...(d.crawled || {})}, checked = {...(d.checked || {})}, known = trackedIds(c);
  const src = trackedChannels(c).filter(ch => Date.now() - (crawled[ch.id] || 0) > 7 * 864e5).slice(0, maxCrawl);
  const cands = new Set();
  for (const ch of src) {
    crawled[ch.id] = Date.now();
    try {
      const r = await api('channelSections', {part:'contentDetails', channelId:ch.id}, 1);
      for (const sec of r.items || []) for (const id of sec.contentDetails?.channels || []) if (!known.has(id) && !checked[id]) cands.add(id);
    } catch (e) { if (/limit/.test(e.message)) break; }
  }
  const n = await verifyCandidates(c, [...cands].slice(0, maxCheck), checked);
  saveDisc(c.id, {crawled, checked});
  return n;
}
// kandidáti: poslední videa (10 na kanál) → kanál se začne sledovat, když má Brawl video v jazyce státu.
// U kanálu, kde se nezmiňuje Brawl v každém názvu (LukeX BS: „Spike VS 10 El Primos!“), stačí jméno brawlera nebo tagy.
async function verifyCandidates(c, ids, checked) {
  const before = trackedIds(c), vidIds = [];
  for (const id of ids) {
    checked[id] = Date.now();
    try { const r = await api('playlistItems', {part:'contentDetails', playlistId:'UU' + id.slice(2), maxResults:10}, 1); vidIds.push(...r.items.map(x => x.contentDetails.videoId)); }
    catch (e) { if (/limit/.test(e.message)) break; }
  }
  if (vidIds.length) {
    const items = (await details(vidIds)).map(it => classify(it)).filter(it => !it.cand);
    learnChannels(c, items.filter(alive));
    for (const p of ['day', 'week', 'month']) { const since = Date.now() - PERIODS[p].hours * 3600e3; const add = items.filter(it => langOk(it, c) && new Date(it.pub) >= since); if (add.length) mergeInto(c.id, p, add); }
  }
  return [...trackedIds(c)].filter(id => !before.has(id)).length;
}
// Spustí se samo po otevření státu jednou za S.discDays dní (sdílí se přes Disk), nebo tlačítkem.
// Důkladné kolo: všechny výrazy státu (videa i kanály, 4–8 hledání) + doporučené kanály. Tlačítko = jeden další výraz (1 hledání).
async function discover(c, manual) {
  if (discover.busy) return; discover.busy = true;
  try {
    status(`🔭 Hledám malé kanály – ${c.name}…`);
    let n = 0;
    const qs = DISC_Q[c.id] || ['brawl stars'];
    for (let i = 0; i < (manual ? 1 : qs.length) && searchLeft(); i++) {
      status(`🔭 Hledám malé kanály – ${c.name} (${i + 1}/${manual ? 1 : qs.length})…`);
      n += await discoverSearch(c, manual ? undefined : i);
    }
    n += await discoverFeatured(c, manual ? 15 : 40, manual ? 30 : 80);
    // ruční tlačítko neposouvá termín důkladného kola; důkladné kolo si zapíše i den (nejvýš jeden stát denně)
    saveDisc(c.id, {...(manual ? {} : {last:Date.now()}), found:n, total:(discInfo(c.id).total || 0) + n});
    if (!manual) saveDisc('_auto', {last:Date.now()});
    if (n) logEvent(`🔭 objevil ${n} nových kanálů (${c.name})`);
    status(n ? `🔭 ${c.name}: nově sleduju ${n} ${n === 1 ? 'kanál' : n < 5 ? 'kanály' : 'kanálů'} – jejich videa přibudou při další obnově.` : manual ? `🔭 ${c.name}: tentokrát nic nového.` : '');
    rerender();
  } catch (e) { status(e.message, true); }
  finally { discover.busy = false; }
}
// důkladné kolo stojí 4–8 hledání → nejvýš jeden stát za den a jen když zbývá dost hledání na zbytek dne
const discoverDue = c => Date.now() - (discInfo(c.id).last || 0) > S.discDays * 864e5
  && Date.now() - (discInfo('_auto').last || 0) > 20 * 3600e3
  && S.slimit - quota().s >= (DISC_Q[c.id] || []).length + 15;

// Kolik HLEDÁNÍ by načtení stálo (ostatní dotazy jsou prakticky zdarma). 0 = jen lehká aktualizace.
// extra = otevření ze seznamu státu (může přidat hledání nejnovějších)
function costFor(c, p, extra) {
  if (!PERIODS[p].hours) return 1;
  const set = baseSet(c.id, p);
  if (set && Date.now() - (set.searchTs || set.ts || 0) < SEARCH_EVERY * 60e3) return 0;
  if (!searchLeft()) return 0; // hledání došla → stejně proběhne jen lehká aktualizace

// ---------- AI kontrola miniatur (model CLIP běží přímo v prohlížeči, zdarma) ----------
// Porovná miniaturu s popisy různých her. Brawl od Minecraftu/Robloxu/vlogů pozná dobře, od Clash Royale hůř
// (stejný styl Supercellu) – proto je jen pomocník ke „slovům sezóny“, ne hlavní rozhodčí.
// pending = fronta podle ID videa (dřív Set objektů → každé překreslení přidalo stejné video znovu jako novou kopii)
// bad = miniatury, které se nepodařilo načíst – do obnovení stránky je znovu nezkoušet
const AI = {ready:null, pending:new Map(), bad:new Set(), running:false};
const AI_CACHE = ls('bt_aicache', {});
const AI_YES = ['a screenshot of the mobile game Brawl Stars', 'colorful cartoon characters from the game Brawl Stars', 'a YouTube thumbnail of a Brawl Stars video'];
const AI_NO = ['a screenshot of Minecraft', 'a screenshot of Roblox', 'a screenshot of Fortnite', 'a screenshot of Clash Royale', 'a screenshot of Clash of Clans',
  'a screenshot of Stumble Guys', 'a screenshot of Free Fire or PUBG Mobile', 'a screenshot of Squad Busters', 'a screenshot of Geometry Dash', 'a photo of real people', 'a football video game',
  'a screenshot of Counter-Strike CS:GO or Standoff 2', 'a first-person shooter game with guns', 'a competitive rank leaderboard of a shooter game', 'a screenshot of Valorant or Call of Duty',
  'a screenshot of GTA', 'a horror game like Doors or Poppy Playtime', 'a screenshot of Among Us'];
const AI_VER = 2; // při změně popisů výš zvýšit – staré verdikty se pak spočítají znovu
const AI_WEAK = 0.35; // video se slovem sezóny musí mít aspoň tolik (vyřadí jasný Minecraft/Roblox/vlog)
const AI_SURE = 0.9;  // video úplně bez slov sezóny projde jen při takové jistotě
function rows(t) {
  const [nr, d] = t.dims, out = [];
  for (let i = 0; i < nr; i++) {
    const v = t.data.slice(i * d, i * d + d);
    let s = 0; for (const x of v) s += x * x; s = Math.sqrt(s);
    out.push(v.map(x => x / s));
  }
  return out;
}
const dot = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };
// 🤖 AI běží v samostatném vlákně (Web Worker) – výpočet jedné miniatury trvá na mobilu i vteřinu a v hlavním
// vlákně by po tu dobu zamrzlo scrollování. Když worker nejde (starý prohlížeč), jede to postaru v hlavním vlákně.
const AI_WORKER_SRC = `
let T, proc, vis;
const rows = t => { const [nr, d] = t.dims, out = []; for (let i = 0; i < nr; i++) { const v = Array.from(t.data.slice(i * d, i * d + d)); let s = 0; for (const x of v) s += x * x; s = Math.sqrt(s); out.push(v.map(x => x / s)); } return out; };
onmessage = async ({data:m}) => {
  try {
    if (m.init) {
      T = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2');
      const M = 'Xenova/clip-vit-base-patch32';
      let tok, txt; [proc, vis, tok, txt] = await Promise.all([
        T.AutoProcessor.from_pretrained(M), T.CLIPVisionModelWithProjection.from_pretrained(M, {dtype:'q8'}),
        T.AutoTokenizer.from_pretrained(M), T.CLIPTextModelWithProjection.from_pretrained(M, {dtype:'q8'})]);
      postMessage({id:m.id, text:rows((await txt(tok(m.init, {padding:true, truncation:true}))).text_embeds)});
    } else {
      const img = await T.RawImage.read(m.url);
      postMessage({id:m.id, e:rows((await vis(await proc(img))).image_embeds)[0]});
    }
  } catch (e) { postMessage({id:m.id, err:String(e && e.message || e)}); }
};`;
function aiWorkerCall(msg) {
  return new Promise((res, rej) => {
    const id = (AI.seq = (AI.seq || 0) + 1);
    AI.wait = AI.wait || {}; AI.wait[id] = {res, rej};
    AI.worker.postMessage({...msg, id});
  });
}
function aiInit() {
  if (AI.ready) return AI.ready;
  AI.ready = (async () => {
    status('🤖 Stahuju AI model (poprvé asi 150 MB, pak je uložený v prohlížeči)…');
    try {
      AI.worker = new Worker(URL.createObjectURL(new Blob([AI_WORKER_SRC], {type:'text/javascript'})), {type:'module'});
      AI.worker.onmessage = ({data:d}) => { const w = AI.wait[d.id]; if (!w) return; delete AI.wait[d.id]; d.err ? w.rej(new Error(d.err)) : w.res(d); };
      AI.text = (await aiWorkerCall({init:[...AI_YES, ...AI_NO]})).text;
      status(''); return;
    } catch (e) { AI.worker?.terminate(); AI.worker = null; throw e; }
  })();
  // při chybě už NIKDY znovu (do obnovení stránky) – dřív se model při každém překreslení načítal znova a znova
  // (pokaždé stovky MB paměti navíc) a v hlavním vlákně zasekával stránku
  AI.ready.catch(e => { AI.failed = true; status('AI kontrola miniatur se nespustila: ' + e.message, true); });
  return AI.ready;
}
async function embed(url) {
  return (await aiWorkerCall({url})).e;
}
function aiScore(e) {
  const logits = AI.text.map(t => dot(e, t) * 100), mx = Math.max(...logits);
  const ex = logits.map(l => Math.exp(l - mx)), sum = ex.reduce((a, b) => a + b, 0);
  return {s:+(ex.slice(0, AI_YES.length).reduce((a, b) => a + b, 0) / sum).toFixed(2), v:AI_VER};
}
// Verdikt se pamatuje navždy (sdílí se přes Disk). Po rozšíření popisů jiných her (AI_VER 2: CS:GO, střílečky…) se znovu
// kontrolují jen staré verdikty „je to Brawl“ – nové popisy můžou Brawl skóre jen snížit, „není Brawl“ tedy platí dál.
const aiOf = it => { const a = AI_CACHE[it.id]; return a && ((a.v || 1) >= AI_VER || a.s < 0.5) ? a : null; };
function aiBadge(it) {
  const a = aiOf(it);
  if (!S.ai || !a || !it.cand) return '';
  return `<span class="tag ${a.s >= 0.5 ? 'ok' : 'hot'}" data-ai title="Jak moc miniatura vypadá jako Brawl Stars (podle AI)">🤖 Brawl ${Math.round(a.s * 100)} %</span>`;
}
// Projde miniatury sporných videí (bez „Brawl Stars“ v textu), které ještě nemají verdikt
async function aiCheck(items) {
  if (!S.ai || AI.failed) return;
  // jiná hra v názvu nebo zablokované video = verdikt je jasný bez AI
  items.filter(it => (it.cand || strictCh(it)) && !aiOf(it) && !otherGame(it) && !BLOCK.videos[it.id] && !AI.bad.has(it.id)).forEach(it => AI.pending.set(it.id, it));
  if (AI.running || !AI.pending.size) return;
  AI.running = true;
  let newCand = false, done = 0;
  try {
    await aiInit();
    while (AI.pending.size && S.ai) {
      const it = AI.pending.values().next().value; AI.pending.delete(it.id);
      if (aiOf(it)) continue;
      status(`🤖 Kontroluju miniatury… (${++done}, zbývá ${AI.pending.size})`);
      try { AI_CACHE[it.id] = aiScore(await embed(thumb(it))); } catch { AI.bad.add(it.id); continue; }
      if (it.cand || strictCh(it)) newCand = true;
      document.querySelectorAll(`.card[data-id="${it.id}"] .tags`).forEach(el => {
        el.querySelector('[data-ai]')?.remove(); el.insertAdjacentHTML('afterbegin', aiBadge(it));
      });
      if (done % 10 === 0) saveAi();
    }
    status('');
  } catch {} finally { AI.running = false; saveAi(); }
  if (newCand) { TERMS = null; rerender(); }
}
function saveAi() {
  const keys = Object.keys(AI_CACHE);
  if (keys.length > 30000) keys.slice(0, keys.length - 30000).forEach(k => delete AI_CACHE[k]); // dřív 5 000 → mazaly se a kontrolovaly dokola
  ss('bt_aicache', AI_CACHE);
}

// ---------- Překlad názvů do češtiny (Google Překladač, zdarma, bez klíče) ----------
const TR = ls('bt_tr', {});
async function trOne(text, sl = 'auto', tl = 'cs') {
  const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=` + encodeURIComponent(text));
  const j = await r.json();
  return j[0].map(s => s[0]).join('');
}
// Názvy hry a brawlerů Google jinak překládá („Mortis“ → „smrt“), proto je schováme do {0}, {1}… a po překladu vrátíme
const PROTECT_RX = new RegExp('(?<!\\p{L})(brawl ?stars|бравл ?старс|brawlers?|бравлер\\p{L}*|' +
  BRAWLERS.map(b => b.replace(/\./g, '\\.')).join('|') + ')(?!\\p{L})', 'giu');
function protect(t) {
  const terms = [];
  const text = t.replace(PROTECT_RX, m => {
    const l = m.toLowerCase();
    terms.push(/^(brawl ?stars|бравл ?старс)$/.test(l) ? 'Brawl Stars' : /^(brawlers|бравлер(ы|ов|ам|ами))$/.test(l) ? 'brawleři' : /^(brawler|бравлер)/.test(l) ? 'brawler' : m);
    return '{' + (terms.length - 1) + '}';
  });
  return {text, terms};
}
const unprotect = (t, terms) => t.replace(/\{\s*(\d+)\s*\}/g, (m, i) => terms[+i] ?? m);
async function translate(texts, sl = 'auto') {
  const need = [...new Set(texts.filter(t => !(t in TR)))];
  for (const part of chunks(need, 15)) {
    const prot = part.map(protect);
    // víc názvů v jednom dotazu (oddělené řádkem); když se řádky nesejdou, přeložíme po jednom
    let out = (await trOne(prot.map(p => p.text).join('\n'), sl)).split('\n');
    if (out.length !== part.length) out = await Promise.all(prot.map(p => trOne(p.text, sl)));
    part.forEach((t, i) => TR[t] = unprotect((out[i] || '').trim(), prot[i].terms) || t);
  }
  const keys = Object.keys(TR);
  if (keys.length > 3000) keys.slice(0, keys.length - 3000).forEach(k => delete TR[k]);
  ss('bt_tr', TR);
}
async function autoTranslate() {
  if (!S.trAuto) return;
  const els = [...document.querySelectorAll('.title[data-orig]')];
  const langs = [...new Set(els.map(el => el.dataset.lang))];
  try { for (const l of langs) await translate(els.filter(el => el.dataset.lang === l).map(el => el.dataset.orig), l); }
  catch { status('Překlad se nepovedl (Google Překladač neodpovídá) – zkus to později.', true); return; }
  for (const el of els) {
    if (!TR[el.dataset.orig]) continue;
    el.textContent = TR[el.dataset.orig];
    el.closest('.card').querySelector('[data-tr]').textContent = '🌐 Originál';
  }
}
async function toggleTranslate(b) {
  const el = b.closest('.card').querySelector('.title'), orig = el.dataset.orig;
  if (el.textContent !== orig) { el.textContent = orig; b.textContent = '🌐 Přeložit'; return; }
  b.textContent = '…';
  try { await translate([orig], el.dataset.lang); el.textContent = TR[orig]; b.textContent = '🌐 Originál'; }
  catch { b.textContent = '🌐 Přeložit'; status('Překlad se nepovedl – zkus to později.', true); }
}

// ---------- Vyhledávání (česky → přeloží se do jazyka státu, toleruje překlepy a tvary slov) ----------
const QTR = ls('bt_qtr', {}); // překlady hledaných výrazů: "lang|výraz" → překlad
const norm = s => s.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
const words = s => norm(s).match(/[\p{L}\p{N}]+/gu) || [];
function lev1(a, b) { // vzdálenost nejvýš 1 (překlep / chybějící písmeno)?
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, diff = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++diff > 1) return false;
    if (a.length === b.length && a[i] === b[j + 1] && a[i + 1] === b[j]) { i += 2; j += 2; continue; } // přehozená písmena
    if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
  }
  return diff + (a.length - i) + (b.length - j) <= 1;
}
// slovo dotazu sedí na slovo názvu: začátek slova (tvary: box → boxy, boxen), nebo překlep u delších slov
const wordHit = (w, tok) => tok.startsWith(w) || (w.length >= 4 && tok.startsWith(w.slice(0, -1))) || (w.length >= 5 && (lev1(w, tok) || lev1(w, tok.slice(0, w.length))));
async function queryVariants(q, langs) {
  const need = langs.filter(l => l !== 'cs' && !((l + '|' + q) in QTR));
  await Promise.all(need.map(async l => {
    try { const p = protect(q); QTR[l + '|' + q] = unprotect(await trOne(p.text, 'cs', l), p.terms); } catch {}
  }));
  ss('bt_qtr', QTR);
}
// ⚡ rozklad názvů na slova se pamatuje (dřív se při každém hledání znovu normalizovaly tisíce názvů)
const QTOK = new Map(), QWS = new Map();
function qTokens(it) {
  const key = it.t + '\u0001' + (TR[it.t] || '') + '\u0001' + (it.ch || '');
  let e = QTOK.get(key);
  if (!e) {
    if (QTOK.size > 60000) QTOK.clear();
    // hledá se v názvu, jeho překladu i ve jménu kanálu (napíšeš „Eby“ → ukáže videa kanálu Eby)
    // jméno kanálu i se zdrobnělinou / koncovkou: „Ebynovce“, „Štěpsovo“ najde kanál Eby / Štěps
    e = {text:words(key.replace(/\u0001/g, ' ')), chToks:words(it.ch || '').filter(t => t.length >= 3)};
    QTOK.set(key, e);
  }
  return e;
}
const qWords = v => { let ws = QWS.get(v); if (!ws) { const w = words(v).filter(w => w.length >= 3 && !STOP.has(w)); ws = w.length ? w : words(v); if (QWS.size > 500) QWS.clear(); QWS.set(v, ws); } return ws; };
function matchQ(it) {
  const q = S.q.trim(); if (!q) return true;
  const {text, chToks} = qTokens(it);
  const variants = [q, QTR[it.c.lang + '|' + q]].filter(Boolean);
  // stačí, když sedí aspoň polovina významových slov (překlad nikdy nesedí slovo od slova)
  return variants.some(v => {
    const list = qWords(v);
    return list.filter(w => text.some(tok => wordHit(w, tok)) || chToks.some(t => w.startsWith(t))).length >= Math.ceil(list.length / 2);
  });
}
let qTimer = null;
function onSearchInput(v) {
  S.q = v; clearTimeout(qTimer);
  qTimer = setTimeout(async () => {
    const langs = S.qScope === 'all' || S.period === 'ideas' ? [...new Set(COUNTRIES.map(c => c.lang))] : [C(S.country).lang];
    if (S.q.trim()) { status('🔎 Překládám hledaný výraz…'); await queryVariants(S.q.trim(), langs); status(''); }
    renderMain();
  }, 450);
}
// Hledání ve všech uložených videích všech států (Novinky, Týden, Celá doba, Archiv)
// všechna videa všech států připravená k hledání – pamatuje se, dokud se nezmění data/filtry (jako gather)
let SALL = null;
function searchPool() {
  const key = [DATAVER, S.type, S.strict, S.noLive, Object.keys(BLOCK.videos).length, Object.keys(BLOCK.channels).length].join('|');
  if (SALL?.key === key) return SALL.v;
  const seen = new Set(), out = [];
  for (const c of COUNTRIES) {
    const raw = [...TIME_PERIODS.flatMap(p => getSet(c.id, p)?.items || []), ...(getArchive(c.id)?.items || [])];
    for (const it of prepare(raw, c)) if (!seen.has(it.id)) { seen.add(it.id); out.push(it); }
  }
  return (SALL = {key, v:out}).v;
}
function renderSearchAll() {
  const list = searchPool().filter(matchQ);
  list.sort(SORTS[S.sort]);
  const q = S.q.trim();
  const tr = [...new Set(COUNTRIES.map(c => QTR[c.lang + '|' + q]).filter(t => t && norm(t) !== norm(q)))];
  $('#main').innerHTML = `<div class="summary"><h3>🔎 „${esc(q)}“ ve všech uložených videích – ${list.length} výsledků</h3>
    ${tr.length ? `<div class="row ch">Hledáno i jako: ${tr.slice(0, 14).map(t => `<span class="tag blue">${esc(t)}</span>`).join('')}</div>` : ''}</div>
    ${list.length ? progCards(list.slice(0, 200), true) : '<div class="empty">Nic nenalezeno. Zkus jiné slovo nebo načti víc dat.</div>'}`;
  document.querySelectorAll('#main .grid[data-prog]').forEach(gridFill);
  autoTranslate();
}

// ---------- Hlavička ----------
function renderHeader() {
  const nb = Object.keys(BLOCK.videos).length + Object.keys(BLOCK.channels).length;
  // na mobilu jen emoji vpravo nahoře (popisky .hidem se schovají)
  $('#btnBlocked').innerHTML = '🚫<span class="hidem"> Zablokované' + (nb ? ` (${nb})` : '') + '</span>';
  $('#btnBlocked').title = 'Zablokované' + (nb ? ` (${nb})` : '');

// ⚡ výsledek gather() se pamatuje, dokud se nezmění data (DATAVER) nebo filtry – dřív se při každém kliknutí v Nápadech
// znovu prohnaly desítky tisíc videí z Celé doby (regexy formátů, brawlerů, jazyka) → na PC lag, na mobilu ještě horší
var GATHER = {};
function gather(p) {
  const key = [DATAVER, S.type, S.strict, S.noLive, Object.keys(BLOCK.videos).length, Object.keys(BLOCK.channels).length].join('|');
  const hit = GATHER[p];
  if (hit && hit.key === key) return hit.v;
  return (GATHER[p] = {key, v:gatherNow(p)}).v;

function gatherNow(p) {
  let out = [], loaded = 0, oldest = Infinity;
  for (const c of COUNTRIES) {
    if (c.id === 'cz') continue; // konkurenci do nápadů nemícháme
    const set = getSet(c.id, p);
    if (!set) continue;
    loaded++; oldest = Math.min(oldest, set.ts);
    out.push(...prepare(set.items, c));
  }
  const seen = new Set(); // stejné video může vrátit víc států
  out = out.filter(it => !seen.has(it.id) && seen.add(it.id));
  return {list:out, loaded, oldest};
}

// data, jejichž změna na stránce nic viditelného nemění (počítadla, protokol, značky robota…) → nepřekreslovat
const QUIET_KEYS = /^bt_(qs|busy|log(_g_[a-z0-9_]+)?|tomb|new|autoAt|aicache|qtr|trash)$/;
async function pullShared() {
  // (data mohla přijít i „mimochodem“ při nahrávání – i tehdy překreslit, jinak zůstalo třeba poloviční šedé pásmo)

  let added = 0;

let LAST_SCROLL = 0, CALM_T = null;

// start: nejdřív načíst velká data z IndexedDB (a poprvé je tam přestěhovat z localStorage), pak teprve kreslit

var PING = {on:() => typeof Notification !== 'undefined' && Notification.permission === 'granted'};
async function pingEnable() {
  if (typeof Notification === 'undefined') return status('Tenhle prohlížeč oznámení neumí – zkus Chrome.', true);
  const p = await Notification.requestPermission();
  if (p === 'granted') { try { await navigator.serviceWorker?.register('sw.js'); } catch {} pingSound(); status('🔔 Oznámení zapnutá – až ti Samko pošle zadání miniatury, vyskočí okno se zvukem.'); }
  else status('Oznámení jsou zakázaná – povol je v nastavení prohlížeče u téhle stránky (ikona zámku vedle adresy).', true);

function pingSound() {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)();
    [[880, 0], [1320, .18]].forEach(([f, t]) => { const o = a.createOscillator(), g = a.createGain();
      o.frequency.value = f; g.gain.setValueAtTime(.25, a.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t + .35);

  } catch {}
}
async function pingShow(e) {

// obnoví (data zůstanou) – jen ne, když zrovna píšeš; pak ukáže tlačítko.
async function checkNewVersion() {
  if (location.protocol === 'file:' || Date.now() - (checkNewVersion.at || 0) < 20e3) return;
