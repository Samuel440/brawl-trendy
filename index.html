<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,Roboto,sans-serif}
a{color:inherit}
button,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.costly{background:#fff;color:#111;border-color:#fff}
button.costly:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
button:disabled{opacity:.55;cursor:default}
button.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,23,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:900;font-size:20px;letter-spacing:.5px}
.logo span{color:var(--accent)}
#status{color:var(--muted);flex:1;min-width:160px}

.right{display:flex;gap:8px;align-items:center}
#quota{color:var(--muted);font-size:12px}
#quota{display:inline-flex;flex-wrap:wrap;gap:2px 10px;justify-content:flex-end}
#quota b{color:var(--text);font-weight:600}
#quota .hot{color:var(--hot)}
nav{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
nav button{border-radius:999px;padding:7px 14px;font-weight:600}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}

.body{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}

.chlink{text-decoration:none;color:var(--text)}

.ch{color:var(--muted);font-size:12.5px}
.stats{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}

.tag.ok{background:rgba(61,220,132,.15);color:#7ff0b0}

</style>

  const moved = Object.keys(localStorage).filter(k => KV_RX.test(k));

    try { if (KV.has(k)) v = JSON.stringify(mergeKey(k, JSON.parse(v), JSON.parse(KV.get(k)))); } catch {}
    kvSetRaw(k, v);

  moved.forEach(k => localStorage.removeItem(k));
}

  else { try { remote = await REMOTE.getAll(); } catch (e) { SYNC.ok = false; if (e.message === 'auth') driveLost(); return false; } }

  // záznamy o smazání nejdřív, ať se podle nich řídí slučování ostatního
  for (const [k, e] of Object.entries(remote).sort(([a], [b]) => (b === 'bt_tomb') - (a === 'bt_tomb'))) {
    const mine = ls(k, null);

    if (!SHARED_RX.test(k) || (mine != null && (meta[k] || 0) >= e.t)) continue;
    // všechno se SLUČUJE – stejný účet na PC i mobilu zapisuje do stejného souboru, tak novější verze
    // nesmí přepsat starší (prázdné zařízení by smazalo ⭐ nebo blokace); smazání řeší bt_tomb
    const v = mine == null ? e.v : mergeKey(k, mine, e.v);
    const raw = JSON.stringify(v);
    if (raw === JSON.stringify(e.v)) { kvSetRaw(k, raw); meta[k] = e.t; }
    else { kvSetRaw(k, raw); meta[k] = Date.now(); SYNC.dirty[k] = true; } // sloučená verze má i naše změny → poslat dál

  for (const k of kvKeys()) if (SHARED_RX.test(k) && (!remote[k] || (meta[k] || 0) > remote[k].t)) { meta[k] ??= Date.now(); SYNC.dirty[k] = true; }

// ---------- AI kontrola miniatur (model CLIP běží přímo v prohlížeči, zdarma) ----------
// Porovná miniaturu s popisy různých her. Brawl od Minecraftu/Robloxu/vlogů pozná dobře, od Clash Royale hůř
// (stejný styl Supercellu) – proto je jen pomocník ke „slovům sezóny“, ne hlavní rozhodčí.
const AI = {ready:null, pending:new Set(), running:false};

const AI_YES = ['a screenshot of the mobile game Brawl Stars', 'colorful cartoon characters from the game Brawl Stars', 'a YouTube thumbnail of a Brawl Stars video'];
const AI_NO = ['a screenshot of Minecraft', 'a screenshot of Roblox', 'a screenshot of Fortnite', 'a screenshot of Clash Royale', 'a screenshot of Clash of Clans',
  'a screenshot of Stumble Guys', 'a screenshot of Free Fire or PUBG Mobile', 'a screenshot of Squad Busters', 'a screenshot of Geometry Dash', 'a photo of real people', 'a football video game'];

function rows(t) {
  const [nr, d] = t.dims, out = [];
  for (let i = 0; i < nr; i++) {
    const v = t.data.slice(i * d, i * d + d);

    const T = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2');
    const M = 'Xenova/clip-vit-base-patch32';
    const [proc, vis, tok, txt] = await Promise.all([
      T.AutoProcessor.from_pretrained(M), T.CLIPVisionModelWithProjection.from_pretrained(M, {dtype:'q8'}),
      T.AutoTokenizer.from_pretrained(M), T.CLIPTextModelWithProjection.from_pretrained(M, {dtype:'q8'})]);
    Object.assign(AI, {T, proc, vis});
    AI.text = rows((await txt(tok([...AI_YES, ...AI_NO], {padding:true, truncation:true}))).text_embeds);
    status('');
  })();
  AI.ready.catch(e => { AI.ready = null; status('AI model se nepodařilo načíst: ' + e.message, true); });
  return AI.ready;
}
async function embed(url) {

}

  const ex = logits.map(l => Math.exp(l - mx)), sum = ex.reduce((a, b) => a + b, 0);
  return {s:+(ex.slice(0, AI_YES.length).reduce((a, b) => a + b, 0) / sum).toFixed(2)};

  const a = aiOf(it);

async function aiCheck(items) {
  if (!S.ai) return;

const QTR = ls('bt_qtr', {}); // překlady hledaných výrazů: "lang|výraz" → překlad
const norm = s => s.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');

function lev1(a, b) { // vzdálenost nejvýš 1 (překlep / chybějící písmeno)?
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, diff = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++diff > 1) return false;
    if (a.length === b.length && a[i] === b[j + 1] && a[i + 1] === b[j]) { i += 2; j += 2; continue; } // přehozená písmena
    if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
  }
  return diff + (a.length - i) + (b.length - j) <= 1;
}
// slovo dotazu sedí na slovo názvu: začátek slova (tvary: box → boxy, boxen), nebo překlep u delších slov

    try { const p = protect(q); QTR[l + '|' + q] = unprotect(await trOne(p.text, 'cs', l), p.terms); } catch {}

}
function matchQ(it) {
  const q = S.q.trim(); if (!q) return true;
  const text = words(it.t + ' ' + (TR[it.t] || ''));
  const variants = [q, QTR[it.c.lang + '|' + q]].filter(Boolean);
  // stačí, když sedí aspoň polovina významových slov (překlad nikdy nesedí slovo od slova)
  return variants.some(v => {
    const ws = words(v).filter(w => w.length >= 3 && !STOP.has(w));

}

  const my = ls('bt_my', null);
  if (!my?.uploads) return loadMyChannel(my.input);
  const p = await api('playlistItems', {part:'snippet', playlistId:my.uploads, maxResults:50}, 1);
  const have = new Set(my.videos.map(v => v.id));
  const fresh = p.items.map(x => ({id:x.snippet.resourceId.videoId, t:x.snippet.title, pub:x.snippet.publishedAt}))
    .filter(v => !have.has(v.id) && v.t !== 'Private video' && v.t !== 'Deleted video');
  ss('bt_my', {...my, videos:[...fresh, ...my.videos], ts:Date.now()});
  await enrichMine();
  return fresh.length;
}
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function trendPool() {
  const seen = new Set(), out = [];
  // jen dlouhá videa – shorty od ostatních do míchače nepatří
  for (const c of COUNTRIES) if (c.id !== 'cz') for (const p of ['day', 'week']) for (const it of prepare(getSet(c.id, p)?.items || [], c))
    if (!it.short && !seen.has(it.id)) { seen.add(it.id); out.push(it); }
  return out.sort((a, b) => b.vph - a.vph).slice(0, 150);
}
function reroll() {
  const mine = (ls('bt_my', null)?.videos || []).filter(myUsable);
  if (!mine.length) return;
  MIX.a = pick(mine);
  if (MIX.mode === 'trend') { const pool = trendPool(); MIX.b = pool.length ? pick(pool) : null; }
  else { do { MIX.b = pick(mine); } while (mine.length > 1 && MIX.b.id === MIX.a.id); }
}

  else if (b.id === 'btnMyFull') (async () => {
    try { await loadMyChannel(ls('bt_my', {}).input); MIX.a = null; status(`📺 Hotovo – ${ls('bt_my', {videos:[]}).videos.length} videí za ${MY_YEARS} roky.`); }
    catch (e) { status(e.message, true); }
    renderMain();
  })();
  else if (b.id === 'btnMix') { reroll(); renderMain(); }
  else if (b.dataset.mixmode) { MIX.mode = b.dataset.mixmode; ss('bt_mixmode', MIX.mode); reroll(); renderMain(); }
  else if (b.id === 'btnMixSave') {
    if (!MIX.a || !MIX.b) return;
    ss(mixKey(), [{a:slim(MIX.a), b:slim(MIX.b), note:$('#mixNote').value.trim(), at:Date.now()}, ...ls(mixKey(), [])]);
    logEvent(`💡 uložil nápad: ${shortT(MIX.a.t)} + ${shortT(MIX.b.t)}`);
    reroll(); renderMain();
  }
  else if (b.dataset.mixdel !== undefined) { const s = ls(mixKey(), []); const [d] = s.splice(+b.dataset.mixdel, 1); if (d) tomb(mixKey(), d.at); ss(mixKey(), s); if (d) logEvent(`✖ smazal nápad: ${shortT(d.a?.t || '')}`); renderMain(); }
  else if (b.dataset.tver !== undefined) showVersions(b);
  else if (b.dataset.vdl !== undefined) downloadVersion(b);
  else if (b.id === 'btnThumbsNow') { b.textContent = 'Kontroluju…'; checkAllThumbs(true).then(() => { b.textContent = '✔ Hotovo'; fillVersions(); }); }
  else if (b.dataset.thumb !== undefined) downloadThumb(CARD_ITEMS.get(b.closest('.card').dataset.id), b);
  else if (b.dataset.block !== undefined) { const m = b.closest('.card').querySelector('.blockmenu'); m.hidden = !m.hidden; }
  else if (b.dataset.blockcancel !== undefined) b.closest('.blockmenu').hidden = true;
  else if (b.dataset.blockkind) {
    const it = CARD_ITEMS.get(b.closest('.card').dataset.id);
    block(it, b.dataset.blockkind);
    status(b.dataset.blockkind === 'video' ? '🚫 Video zablokováno – vrátit ho jde v „Zablokované“.' : `🚫 Kanál ${it.ch} zablokován${b.dataset.blockkind === 'strict' ? ' (ukážou se jen ověřená Brawl videa)' : ''} – vrátit ho jde v „Zablokované“.`);
    rerender();
  }
  else if (b.id === 'btnBlocked') { S.view = 'blocked'; renderBlocked(); }
  else if (b.id === 'btnSettings') { S.view = 'settings'; renderSettings(); }
  else if (b.id === 'btnClose') { S.view = null; rerender(); window.scrollTo(0, 0); }
  else if (b.dataset.unblockch) { logEvent(`↩ odblokoval kanál ${BLOCK.channels[b.dataset.unblockch]?.name || ''}`); delete BLOCK.channels[b.dataset.unblockch]; tomb('bt_block.c', b.dataset.unblockch); saveBlock(); renderBlocked(); }
  else if (b.dataset.unblockv) { logEvent(`↩ odblokoval video ${shortT(BLOCK.videos[b.dataset.unblockv]?.t || '')}`); delete BLOCK.videos[b.dataset.unblockv]; tomb('bt_block.v', b.dataset.unblockv); saveBlock(); renderBlocked(); }
  else if (b.dataset.discover) discover(C(b.dataset.discover), true);
  else if (b.dataset.jump) { const el = document.getElementById(b.dataset.jump); if (el) scrollTo({top:el.getBoundingClientRect().top + scrollY - (getComputedStyle($('header')).position === 'sticky' ? $('header').offsetHeight : 0) - 10, behavior:'smooth'}); }
  else if (b.id === 'btnAddCh') addChannelUI();
  else if (b.dataset.unch) { removeChannel(C(S.country), b.dataset.unch); rerender(); }
  else if (b.id === 'btnSaveKey') { S.key = $('#keyInput').value.trim(); ss('bt_key', S.key); S.view = null; show(); }
});
// zapamatovat, které kategorie v Nápadech máš otevřené
document.addEventListener('toggle', e => {
  const id = e.target.dataset?.sec; if (!id) return;
  ss('bt_open', {...ls('bt_open', {}), [id]:e.target.open});
}, true);
document.addEventListener('input', e => {
  if (e.target.id === 'q') onSearchInput(e.target.value);
  // poznámka u uloženého nápadu se ukládá rovnou při psaní (bez překreslení)
  if (e.target.dataset.mixnote !== undefined) { const s = ls(mixKey(), []); s[+e.target.dataset.mixnote].note = e.target.value; ss(mixKey(), s); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'mixNote') $('#btnMixSave').click(); if (e.key === 'Enter' && e.target.id === 'myInput') $('#btnMyLoad').click(); });
document.addEventListener('change', e => {
  if (e.target.id === 'qScope') { S.qScope = e.target.value; onSearchInput(S.q); return; }
  if (e.target.id === 'importInput' && e.target.files[0]) {
    importData(e.target.files[0]).then(n => status(`💾 Import hotový – sloučeno ${n} částí dat.${REMOTE === DRIVE_BACKEND ? ' Nahrávám na Disk…' : ''}`)).catch(err => status(err.message, true));
    return;
  }
  if (e.target.id === 'gcidInput') { ss('bt_gcid', e.target.value.trim()); renderMain(); return; }
  if (e.target.dataset.chmode) { BLOCK.channels[e.target.dataset.chmode].mode = e.target.value; saveBlock(); return; }
  const k = e.target.dataset.set; if (!k) return;
  S[k] = e.target.type === 'checkbox' ? e.target.checked : (k === 'interval' || k === 'severy' ? +e.target.value : k === 'slimit' ? Math.min(SEARCH_MAX, Math.max(1, +e.target.value || SEARCH_MAX)) : e.target.value);
  if (k === 'slimit') quota();
  if (k === 'severy') SEARCH_EVERY = S.severy * 60;
  ss('bt_' + k, S[k]);
  if (k === 'interval' || k === 'auto') S.nextAuto = Math.max(Date.now() + 5e3, (getSet(S.country, S.period)?.ts || 0) + S.interval * 60e3);
  rerender();
});
// Když je stránka schovaná (jiná karta / minimalizováno), nic se nestahuje; po návratu se hned aktualizuje, pokud už uplynul interval
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.key && S.auto && S.period !== 'ideas' && !PERIODS[S.period].local && S.nextAuto && Date.now() >= S.nextAuto) {
    S.nextAuto = Date.now() + S.interval * 60e3;
    showCountry(false);
  }
});
// Jednorázová oprava: kanály naučené ve státě jen kvůli přeloženému názvu z AI dabingu přestaneme sledovat
// (necháme ruční a ty, které mají v tom státě aspoň jedno video, které tam opravdu patří)
if (!ls('bt_mig_dub', false)) {
  for (const c of COUNTRIES) {
    const db = ls(chKey(c.id), {});
    const items = [...TIME_PERIODS.flatMap(p => getSet(c.id, p)?.items || []), ...(getArchive(c.id)?.items || [])];
    for (const [id, e] of Object.entries(db)) {
      const mine = items.filter(it => it.chId === id);
      if (!e.manual && mine.length && !mine.some(it => langOk(it, c))) delete db[id];
    }
    ss(chKey(c.id), db);
  }
  ss('bt_mig_dub', true);
}
// uložená data odebraných států (Indonésie, Vietnam, arabské země) jen zabírají místo
const cleanupRemovedCountries = () => { for (const k of kvKeys()) if (/^bt_(c|ch|arch)_(id|vn|sa)(_|$)/.test(k)) kvDelete(k); };
// po stažení sdílených dat od ostatních obnovit to, co je načtené v paměti
function reloadMemory() {
  const swap = (obj, val) => { for (const k of Object.keys(obj)) delete obj[k]; Object.assign(obj, val); };
  swap(STARS, ls(starKey(), {})); swap(BLOCK, ls('bt_block', {videos:{}, channels:{}}));
  swap(AI_CACHE, ls('bt_aicache', {})); swap(TR, ls('bt_tr', {})); swap(QTR, ls('bt_qtr', {}));
  for (const k of Object.keys(CHCACHE)) delete CHCACHE[k];
  TERMS = null;
}
async function pullShared() {
  if (!await syncPull()) return;
  reloadMemory(); renderQuotaBar();
  // nepřekreslovat, když zrovna něco píšeš do pole na stránce
  if (S.key && !(document.activeElement?.closest?.('#main') && document.activeElement.matches('input, textarea'))) rerender();
}
// start: nejdřív načíst velká data z IndexedDB (a poprvé je tam přestěhovat z localStorage), pak teprve kreslit
(async () => {
  const load = kvLoad().catch(e => console.warn('IndexedDB nejde, jedu z localStorage', e));
  // když IndexedDB do 2,5 s neodpoví (blokuje ji jiná karta), kreslíme z localStorage a přepneme se, až bude
  // nikdy nekreslit (a hlavně nestahovat z YouTube) s prázdnými daty jen proto, že IndexedDB ještě neodpověděla –
  // stránka by si myslela, že nic nemá, a pálila by hledání
  const ready = await Promise.race([load.then(() => true), new Promise(r => setTimeout(() => r(false), 2500))]);
  if (!ready) { status('⏳ Čekám na úložiště prohlížeče… (když to trvá, zavři ostatní karty Brawl Trendy)'); await load; status(''); }
  // požádat prohlížeč, ať data stránky nikdy sám nemaže (při nedostatku místa apod.)
  navigator.storage?.persist?.().catch(() => {});
  cleanupRemovedCountries();
  // jednorázově: sledované kanály znovu naučit z uložených videí (po smazaném úložišti jich spousta chyběla) – kvótu nestojí
  if (!ls('bt_mig_relearn', false) && KV_OK) {
    for (const c of COUNTRIES) learnChannels(c, [...TIME_PERIODS.flatMap(p => getSet(c.id, p)?.items || []), ...(getArchive(c.id)?.items || [])].filter(it => !it.cand));
    ss('bt_mig_relearn', true);
  }
  reloadMemory();
  // po obnově stránky (aktualizace) se přihlášení k Disku vezme z téhle karty – nemusíš se znovu připojovat
  let tok = null;
  try { tok = JSON.parse(sessionStorage.getItem('bt_tok') || 'null'); } catch {}
  if (tok && tok.exp - 60e3 > Date.now() && ls('bt_gdrive', false) && gClientId()) { DRIVE.token = tok.t; DRIVE.exp = tok.exp; }
  show();
  if (DRIVE.token) await driveConnect(false); else pullShared();
  renderQuotaBar();
  // doplnit měsíc u ručně přidaných kanálů, které ho ještě nemají (jen se sdílením, ať to nedělá každé zařízení zvlášť)
  if (S.key && (REMOTE === DRIVE_BACKEND || !ls('bt_gdrive', false))) pullMissingChannels().then(() => rerender()).catch(() => {});
  // hláška po automatické aktualizaci
  let upd = null;
  try { upd = sessionStorage.getItem('bt_updated'); sessionStorage.removeItem('bt_updated'); } catch {}
  if (upd) status(`✅ Aktualizace proběhla – nová verze ${APP_VERSION}${REMOTE === DRIVE_BACKEND ? ', Disk zůstal připojený' : ''}.`);
})();
// co minutu (když je stránka vidět) se podívat, jestli ostatní nenačetli něco nového – nic to nestojí
setInterval(() => { if (!document.hidden && SYNC.ok) pullShared(); }, 30e3);
// Nová verze stránky: co 2 minuty (a při návratu do okna) se podívat, jestli na webu není novější APP_VERSION. Pokud ano, stránka se sama
// obnoví (data zůstanou) – jen ne, když zrovna píšeš; pak ukáže tlačítko.
async function checkNewVersion() {
  if (location.protocol === 'file:' || Date.now() - (checkNewVersion.at || 0) < 20e3) return;
  checkNewVersion.at = Date.now();
  try {
    const html = await (await fetch(location.pathname + '?v=' + Date.now(), {cache:'no-store'})).text();
    const v = (html.match(/APP_VERSION = '([^']+)'/) || [])[1];
    if (!v || v === APP_VERSION) return;
    const typing = document.activeElement?.matches?.('input, textarea, select');
    if (!typing && !S.busy) { await kvFlush(); try { sessionStorage.setItem('bt_updated', v); } catch {} location.reload(); return; }
    status('🆕 Je tu nová verze stránky. ');
    $('#status').insertAdjacentHTML('beforeend', `<button onclick="kvFlush().then(() => { try { sessionStorage.setItem('bt_updated', '1'); } catch {} location.reload(); })">Obnovit</button>`);
  } catch {}
}
setInterval(() => { if (!document.hidden) checkNewVersion(); }, 2 * 60e3);
addEventListener('focus', () => checkNewVersion());
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkNewVersion(); });
</script>
