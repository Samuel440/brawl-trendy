# 🤖 Sběr bodů do grafů zhlédnutí každých 30 minut – i když jsou všechna zařízení vypnutá.
# Potřebuje v Settings → Secrets and variables → Actions tajnou hodnotu:
#   GDRIVE_SA_JSON  – celý obsah JSON klíče servisního účtu Googlu (složka „Brawl Trendy – data“ mu je nasdílená jako Editor)
#   (YT_API_KEY je nepovinný – servisní účet má i YouTube)
# Minuty 7 a 37 schválně: na celou a půl hodinu má GitHub nejvíc plánovaných běhů a ty se pak zpožďují nebo vypadávají.
name: Grafy zhlédnutí
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grafy
  cancel-in-progress: false
jobs:
  sber:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-auth==2.35.0 requests==2.32.3
      - run: python tools/hist.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
